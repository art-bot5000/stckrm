name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          REQUIRED=(
            app.js budget.js notes.js demo.js scanner.js styles.css
            index.html landing.html
            sw.js manifest.json admin.html diag-trusted.html
            main.ts deno.json start.sh Caddyfile
            logo.png logo.webp package.json
            zxing.min.js
          )
          MISSING=()
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              MISSING+=("$f")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing required files: ${MISSING[*]}"
            exit 1
          fi
          echo "✅ All required files present"

      - name: Check JS syntax
        run: |
          node --check app.js     && echo "✅ app.js syntax OK"
          node --check budget.js  && echo "✅ budget.js syntax OK"
          node --check notes.js   && echo "✅ notes.js syntax OK"
          node --check demo.js    && echo "✅ demo.js syntax OK"
          node --check scanner.js && echo "✅ scanner.js syntax OK"

      - name: Repo drift audit
        # Static analysis of cross-file invariants:
        #   - main.ts URL routes ↔ Caddyfile reverse_proxy handles
        #   - Dockerfile COPY list ↔ files actually present
        #   - deploy.yml REQUIRED list ↔ Dockerfile COPY list
        #   - package.json build script ↔ Dockerfile build steps
        #   - <script src> tags ↔ files in build
        #   - DB_STORES ↔ actual dbGet/dbPut calls
        #   - auth dual-path (sessionToken || verifier) on every authenticated route
        #   - write_dockerfile.py outputs ↔ committed Dockerfile/Caddyfile/start.sh
        #
        # To bypass for an emergency: include "[skip audit]" in the commit
        # message. Use sparingly — every bypass is technical debt.
        if: "!contains(github.event.head_commit.message, '[skip audit]')"
        run: |
          if [ ! -f audit.py ]; then
            echo "⚠ audit.py not found in repo — skipping (script may not be committed yet)"
            exit 0
          fi
          python3 audit.py

      - name: Check Dockerfile references
        run: |
          DOCKERFILE_FILES=(
            app.js budget.js notes.js demo.js scanner.js styles.css
            index.html landing.html admin.html diag-trusted.html
            sw.js manifest.json logo.png logo.webp
            zxing.min.js
          )
          MISSING=()
          for f in "${DOCKERFILE_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              MISSING+=("$f")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Dockerfile references missing files: ${MISSING[*]}"
            exit 1
          fi
          echo "✅ All Dockerfile COPY references exist"

  deploy:
    name: Deploy
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --strategy rolling --ha=false --no-cache
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # --no-cache: forces a clean rebuild of all Docker layers. We had a
        # bug where index.html updates weren't reaching production because
        # Depot's remote builder was reusing cached minify-step output.
        # Without this, frontend file changes can silently not deploy.

      - name: Verify deployment health
        if: always()
        run: |
          sleep 5
          flyctl status --app stckrm
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
